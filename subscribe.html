<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laxmi Dairy Farm | Subscription</title>

    <link rel="stylesheet" href="subscribe.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="subscription-page">
      <!-- Card -->

      <div class="subscription-card">
        <!-- Title -->

        <h1>Subscribe Plan</h1>

        <p class="subtitle">Become a premium member of Laxmi Dairy Farm</p>

        <!-- Form -->

        <form id="subscriptionForm">
          <!-- Name -->

          <div class="input-group">
            <label>Full Name</label>

            <input
              type="text"
              id="name"
              placeholder="Enter your full name"
              required
            />
          </div>

          <!-- Mobile -->

          <div class="input-group">
            <label>Mobile Number</label>

            <input
              type="tel"
              id="mobile"
              maxlength="10"
              placeholder="Enter mobile number"
              required
            />
          </div>

          <!-- Address -->

          <div class="input-group">
            <label>Address</label>

            <textarea
              id="address"
              rows="4"
              placeholder="Enter your complete address"
              required
            ></textarea>
          </div>

          <!-- Plan -->

          <div class="input-group">
            <label>Select Plan</label>

            <select id="selectedPlan" required>
              <option value="">Choose Plan</option>

              <option value="Weekly">Weekly - ₹599</option>

              <option value="Monthly">Monthly - ₹2499</option>

              <option value="Yearly">Yearly - ₹29999</option>
            </select>
          </div>

          <!-- QR -->

          <div class="qr-section">
            <h3>Scan & Pay</h3>

            <div class="scan-button-container">
              <button type="button" class="scan-btn" onclick="openQR()">
                📱 Scan QR
              </button>
            </div>
          </div>

          <!-- Upload -->

          <div class="upload-section">
            <label class="upload-label"> Upload Payment Screenshot </label>

            <input type="file" id="paymentImage" accept="image/*" required />
          </div>

          <!-- Buttons -->

          <div class="button-group">
            <button
              type="button"
              class="back-btn"
              onclick="window.history.back()"
            >
              ← Back
            </button>

            <button type="submit" class="submit-btn">
              Submit Subscription
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/subscribe.js"></script>
    <!-- QR Popup -->

    <div id="qrPopup" class="qr-popup">
      <div class="qr-popup-content">
        <span class="close-popup" onclick="closeQR()">&times;</span>

        <h2>Scan & Pay</h2>

        <img src="qr1.jpeg" class="popup-qr" />

        <p>Scan this QR using PhonePe / Google Pay / Paytm</p>
      </div>
    </div>
  </body>
</html>
