<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laxmi Dairy Farm - Reports</title>

    <link rel="stylesheet" href="reports.css" />
  </head>

  <body>
    <!-- =====================
        HEADER
===================== -->

    <div class="reports-header">
      <div class="report-title">
        <div class="report-icon">📊</div>

        <div>
          <h1>Reports</h1>

          <p>Business Analytics & Summary</p>
        </div>
      </div>

      <img src="logo.jpeg" class="report-logo" />
    </div>

    <!-- =====================
      REPORT CARDS
===================== -->

    <div class="report-grid">
      <div class="report-card">
        <span>🛒</span>

        <h2 id="reportOrders">0</h2>

        <p>Total Orders</p>
      </div>

      <div class="report-card">
        <span>💰</span>

        <h2 id="reportRevenue">₹0</h2>

        <p>Total Revenue</p>
      </div>

      <div class="report-card">
        <span>✅</span>

        <h2 id="reportDelivered">0</h2>

        <p>Delivered</p>
      </div>

      <div class="report-card">
        <span>⏳</span>

        <h2 id="reportPending">0</h2>

        <p>Pending</p>
      </div>
    </div>

    <!-- =====================
      PRODUCT SUMMARY
===================== -->

    <div class="report-section">
      <h2>📦 Product Summary</h2>

      <div id="productReport"></div>
    </div>

    <!-- =====================
      RECENT SALES
===================== -->

    <div class="report-section">
      <h2>🧾 Recent Sales</h2>

      <div id="salesReport"></div>
    </div>

    <script src="js/reports.js"></script>
  </body>
</html>
