<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout | Laxmi Dairy Farm</title>

    <link rel="stylesheet" href="checkout.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="checkout-header">
      <div class="logo-area">
        <img src="logo.jpeg" />

        <div>
          <h2>Laxmi Dairy Farm</h2>

          <p>Fresh • Pure • Healthy</p>
        </div>
      </div>

      <div class="secure">🔒 100% Secure Checkout</div>
    </header>

    <section class="checkout">
      <!-- LEFT -->

      <div class="order-summary">
        <h2>Order Summary</h2>

        <div id="checkoutProducts">
          <!-- Products load here -->
        </div>

        <hr />

        <div class="summary">
          <span>Subtotal</span>

          <span id="subTotal">₹0</span>
        </div>

        <div class="summary total">
          <span>Total</span>

          <span id="grandTotal">₹0</span>
        </div>
      </div>

      <!-- RIGHT -->

      <div class="delivery-card">
        <h2>Delivery Details</h2>

        <form>
          <div class="grid">
            <input type="text" placeholder="Full Name" />

            <input type="tel" placeholder="Phone Number" />
          </div>

          <input type="text" placeholder="House / Flat / Building" />

          <input type="text" placeholder="Area / Street" />

          <div class="grid">
            <input type="text" placeholder="Landmark" />

            <input type="text" placeholder="Pincode" />
          </div>

          <div class="grid">
            <input type="text" placeholder="City" />

            <input type="text" placeholder="State" />
          </div>

          <h3>Payment Method</h3>

          <label class="payment">
            <input type="radio" checked name="payment" />

            Cash On Delivery
          </label>

          <label class="payment">
            <input type="radio" name="payment" />

            UPI Payment
          </label>

          <label class="payment">
            <input type="radio" name="payment" />

            Online Payment
          </label>

          <button type="button" id="placeOrder">Place Order</button>
        </form>
      </div>
    </section>

    <script src="js/checkout.js"></script>
  </body>
</html>
