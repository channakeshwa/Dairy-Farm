<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout | Laxmi Dairy Farm</title>

    <link rel="stylesheet" href="checkout.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="checkout-header">
      <div class="logo-area">
        <img src="logo.jpeg" />

        <div>
          <h2>Laxmi Dairy Farm</h2>

          <p>Fresh • Pure • Healthy</p>
        </div>
      </div>

      <div class="secure">🔒 100% Secure Checkout</div>
    </header>

    <section class="checkout">
      <!-- LEFT -->

      <div class="order-summary">
        <h2>Order Summary</h2>

        <div id="checkoutProducts">
          <!-- Products load here -->
        </div>

        <hr />

        <div class="summary">
          <span>Subtotal</span>

          <span id="subTotal">₹0</span>
        </div>

        <div class="summary total">
          <span>Total</span>

          <span id="grandTotal">₹0</span>
        </div>
      </div>

      <!-- RIGHT -->

      <div class="delivery-card">
        <h2>Delivery Details</h2>

        <form>
          <div class="grid">
            <input type="text" placeholder="Full Name" />

            <input type="tel" placeholder="Phone Number" />
          </div>

          <input type="text" placeholder="House / Flat / Building" />

          <input type="text" placeholder="Area / Street" />

          <div class="grid">
            <input type="text" placeholder="City" />
          </div>
          <h3>Payment Method</h3>

          <div class="payment-options">
            <label class="payment">
              <input type="radio" name="payment" value="COD" checked />

              <span>Cash On Delivery</span>
            </label>

            <label class="payment">
              <input type="radio" name="payment" value="UPI" />

              <span>UPI Payment</span>
            </label>

            <label class="payment">
              <input type="radio" name="payment" value="Online" />

              <span>Online Payment</span>
            </label>
          </div>

          <button type="button" id="placeOrderBtn" class="place-order-btn">
            Place Order
          </button>
        </form>
      </div>
    </section>

    <!-- QR Payment Popup -->

    <div id="paymentPopup" class="payment-popup">
      <div class="payment-card">
        <span class="close-payment">&times;</span>

        <h2>Scan & Pay</h2>

        <img src="qr1.jpeg" class="payment-qr" />

        <button id="paidBtn" class="paid-btn">✔ I've Paid</button>
      </div>
    </div>
    <div id="paymentProof" style="display: none">
      <h3>Upload Payment Screenshot</h3>

      <input type="file" id="paymentImage" accept="image/*" />

      <br /><br />

      <button id="finalOrderBtn">Final Place Order</button>
    </div>
    <script src="js/checkout.js"></script>
  </body>
</html>
