<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laxmi Dairy Products</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Header Starts -->

    <div class="header">
      <div class="header-left">
        <div class="logo">📦</div>

        <div>
          <h1>Products</h1>

          <p>Manage Dairy Inventory</p>
        </div>
      </div>

      <img src="logo.jpeg" class="profile-logo" />
    </div>

    <!-- Search -->

    <div class="search-box">
      <input type="text" placeholder="🔍 Search Products" />
    </div>

    <!-- Section Title -->

    <h2 class="section-title">Available Products</h2>

    <!-- Product Container -->

    <div id="productContainer"></div>
    <!-- Floating Add Button -->

    <button id="addBtn" class="floating-btn">+</button>

    <!-- Add Product Popup -->

    <div id="popup" class="popup">
      <div class="popup-content">
        <h2>Add Product</h2>

        <div class="upload-box">
          <label for="image" class="upload-label">
            <img id="previewImage" src="" style="display: none" />

            <br /><br />

            <strong id="uploadText">Tap to upload Product Image</strong>
          </label>

          <input type="file" id="image" accept="image/*" hidden />
        </div>

        <input type="text" id="productName" placeholder="Product Name" />

        <input type="number" id="productPrice" placeholder="Price" />

        <input type="number" id="productStock" placeholder="Stock Quantity" />
        <select id="productCategory">
          <option value="">Select Category</option>
          <option>Milk</option>
          <option>Curd</option>
          <option>Butter</option>
          <option>Ghee</option>
          <option>Paneer</option>
          <option>Cheese</option>
          <option>Other</option>
        </select>

        <select id="productUnit">
          <option>Liter</option>

          <option>Kg</option>

          <option>Pack</option>
        </select>

        <button id="saveBtn" onclick="addProduct()">💾 Save Product</button>
        <button id="cancelBtn">❌ Cancel</button>
      </div>
    </div>

    <!-- Order Popup -->
    <div id="orderPopup" class="order-popup">
      <div class="order-popup-content">
        <span class="close-order" onclick="closeOrderPopup()">&times;</span>

        <h2 class="popup-title">🛒 Order Product</h2>

        <div class="order-card">
          <div class="order-image">
            <img id="orderProductImage" src="" alt="Product" />
          </div>

          <div class="order-details">
            <h2 id="orderProductName"></h2>

            <div class="price-row">
              <span class="price-value">
                ₹<span id="orderProductPrice"></span> /
                <span id="orderProductUnit"></span>
              </span>
            </div>

            <div class="stock-row">
              <span>Available Stock</span>

              <span class="stock-value">
                <span id="orderProductStock"></span>
                <span id="orderStockUnit"></span>
              </span>
            </div>
          </div>
        </div>

        <div class="quantity-section">
          <label>Quantity</label>

          <div class="qty-box">
            <button class="qty-btn" onclick="decreaseQty()">−</button>

            <span id="orderQuantity"> 1 </span>

            <button class="qty-btn" onclick="increaseQty()">+</button>
          </div>
        </div>

        <div class="total-card">
          <span>Total Amount</span>

          <h2>₹<span id="orderTotal">0</span></h2>
        </div>

        <button id="continueBtn" class="continue-btn">Continue →</button>
      </div>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
