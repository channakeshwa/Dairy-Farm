<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laxmi Dairy Farm | Admin Login</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(135deg, #e8f5e9, #a5d6a7);
      }

      /* LOGIN CARD */

      .admin-card {
        width: 390px;
        background: white;

        padding: 35px;

        border-radius: 25px;

        text-align: center;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);

        animation: show 0.7s ease;
      }

      @keyframes show {
        from {
          opacity: 0;
          transform: translateY(30px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* LOGO */

      .logo {
        width: 130px;
        height: 130px;

        border-radius: 50%;

        object-fit: cover;

        padding: 5px;

        border: 4px solid #2e7d32;

        animation: float 3s infinite ease-in-out;
      }

      @keyframes float {
        50% {
          transform: translateY(-8px);
        }
      }

      h2 {
        color: #1b5e20;

        margin-top: 15px;
      }

      .tag {
        color: #777;

        margin: 10px 0 25px;

        font-size: 14px;
      }

      /* INPUT */

      input {
        width: 100%;

        padding: 15px;

        margin-bottom: 15px;

        border-radius: 12px;

        border: 2px solid #ddd;

        font-size: 15px;
      }

      input:focus {
        outline: none;

        border-color: #2e7d32;
      }

      /* PASSWORD */

      .password-box {
        position: relative;
      }

      .password-box span {
        position: absolute;

        right: 15px;

        top: 15px;

        cursor: pointer;
      }

      /* BUTTON */

      button {
        width: 100%;

        padding: 15px;

        border: none;

        border-radius: 15px;

        background: linear-gradient(135deg, #1b5e20, #43a047);

        color: white;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-3px);

        box-shadow: 0 10px 20px rgba(46, 125, 50, 0.4);
      }

      .error {
        color: red;

        margin-top: 15px;

        font-size: 14px;

        display: none;
      }

      .footer {
        margin-top: 20px;

        font-size: 12px;

        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="admin-card">
      <img src="logo.jpeg" class="logo" />

      <h2>🥛 Laxmi Dairy Farm</h2>

      <p class="tag">Owner Management Panel</p>

      <input type="text" id="adminId" placeholder="👤 Owner ID" />

      <div class="password-box">
        <input type="password" id="password" placeholder="🔒 Password" />

        <span onclick="showPassword()"> 👁️ </span>
      </div>

      <button onclick="login()">Login Dashboard</button>

      <p class="error" id="error">Invalid Owner ID or Password</p>

      <p class="footer">© 2026 Laxmi Dairy Farm Admin</p>
    </div>

    <script>
      function showPassword() {
        let pass = document.getElementById("password");

        pass.type = pass.type === "password" ? "text" : "password";
      }

      function login() {
        let id = document.getElementById("adminId").value;

        let pass = document.getElementById("password").value;

        if (id === "admin" && pass === "1234") {
          localStorage.setItem("adminLogin", "true");

          window.location.href = "dashboard.html";
        } else {
          document.getElementById("error").style.display = "block";
        }
      }
    </script>
  </body>
</html>
