<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laxmi Dairy Farm</title>

    <link rel="stylesheet" href="welcome.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Main Container -->
    <section class="welcome-container">
      <!-- Dark Overlay -->
      <div class="overlay"></div>

      <!-- Sunrise Glow -->
      <div class="sun-glow"></div>

      <!-- Birds -->
      <div class="bird-flock">
        <img src="bird.jpeg" class="bird bird1" alt="" />
        <img src="bird.jpeg" class="bird bird2" alt="" />
        <img src="bird.jpeg" class="bird bird3" alt="" />
        <img src="bird.jpeg" class="bird bird4" alt="" />
        <img src="bird.jpeg" class="bird bird5" alt="" />
        <img src="bird.jpeg" class="bird bird6" alt="" />
        <img src="bird.jpeg" class="bird bird7" alt="" />
        <img src="bird.jpeg" class="bird bird8" alt="" />
      </div>

      <!-- Floating Particles -->
      <div class="particles">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
      </div>

      <!-- Main Content -->
      <div class="content">
        <img src="logo1.jpeg" class="logo" alt="Laxmi Dairy Farm" />

        <h3>Welcome To</h3>

        <h1>Laxmi Dairy Farm</h1>

        <p>Pure Milk • Fresh Every Morning • Delivered with Love</p>

        <button id="enterFarm">Enter The Farm</button>
      </div>
    </section>

    <script src="js/welcome.js"></script>
  </body>
</html>
