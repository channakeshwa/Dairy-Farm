<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order History</title>

    <link rel="stylesheet" href="orders.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- ===========================
        HEADER
=========================== -->

    <header class="orders-header">
      <div class="header-left">
        <div class="header-icon">🛒</div>

        <div>
          <h1>Order History</h1>

          <p>Track & Manage Customer Orders</p>
        </div>
      </div>

      <img src="logo.jpeg" class="header-logo" />
    </header>

    <!-- ===========================
        SEARCH
=========================== -->

    <div class="search-section">
      <div class="search-box">
        <span class="search-icon"> 🔍 </span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search customer, product or phone..."
        />
      </div>

      <button class="filter-btn">⚙</button>
    </div>

    <!-- ===========================
      SUMMARY CARDS
=========================== -->

    <div class="summary-grid">
      <div class="summary-card">
        <h2 id="totalOrders">0</h2>

        <p>Total Orders</p>
      </div>

      <div class="summary-card">
        <h2 id="pendingOrders">0</h2>

        <p>Pending</p>
      </div>

      <div class="summary-card">
        <h2 id="totalRevenue">₹0</h2>

        <p>Revenue</p>
      </div>
    </div>

    <!-- ===========================
        ORDER LIST
=========================== -->

    <section id="orderContainer" class="orders-list"></section>

    <!-- ===========================
      ORDER DETAILS POPUP
=========================== -->

    <div id="orderModal" class="order-modal">
      <div class="modal-content">
        <span id="closeModal" class="close-modal"> &times; </span>

        <h2>Order Details</h2>

        <div id="modalBody"></div>
      </div>
    </div>

    <script src="js/orders.js"></script>
  </body>
</html>
