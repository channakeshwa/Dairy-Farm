<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laxmi Dairy Farm</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f5fff5, #d8f3dc);
      }

      .splash-container {
        text-align: center;
      }

  .logo{

width:170px;
height:170px;

border-radius:50%;

object-fit:cover;

animation:
zoom 2s ease infinite;

box-shadow:
0 15px 35px
rgba(46,125,50,0.4);

}


@keyframes zoom{

0%{
transform:scale(0.9);
opacity:.7;
}


50%{
transform:scale(1);
opacity:1;
}


100%{
transform:scale(0.9);
opacity:.7;
}

}

      h1 {
        margin-top: 15px;
        color: #2e7d32;
        font-size: 36px;
      }

      .tagline {
        color: #666;
        margin-top: 8px;
        font-size: 18px;
      }

      .loader {
        width: 220px;
        height: 8px;
        background: #ddd;
        border-radius: 20px;
        margin: 30px auto;
        overflow: hidden;
      }

      .loader::before {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: #2e7d32;
        border-radius: 20px;
        animation: loading 2s linear infinite;
      }

      .loading-text {
        color: #555;
        font-size: 15px;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100px);
        }
        100% {
          transform: translateX(250px);
        }
      }

      @keyframes zoomIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div class="splash-container">
      <!-- LOGO -->
      <img src="logo1.jpeg" alt="Laxmi Dairy Farm Logo" class="logo" />

      <h1>Laxmi Dairy Farm</h1>

      <p class="tagline">Freshness You Can Trust</p>

      <div class="loader"></div>

      <p class="loading-text">Loading...</p>
    </div>

    <script>
      setTimeout(function () {
        window.location.href = "Login.html";
      }, 3000);
    </script>
  </body>
</html>
